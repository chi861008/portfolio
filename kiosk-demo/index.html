<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>自助點餐機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a fixed 1080×1920 kiosk screen scaled to fit the window. All sizes are the Figma frame's own px. Single light look, by design. */
:root{
  --bg:#FAF9F7; --tile:#F1EEEA; --tile-2:#DDD8D1; --ink:#282522; --ink-2:#3D3935; --mute:#948D86; --dark:#554F49;
  --line:#A49C92; --row:#E2E2E2; --sum:#BDBDBD; --accent:#C94F15; --accent-soft:#EAC0AC; --peach:#FFDCC8; --peach-line:#F5BFA3;
  --green:#278E76; --green-line:#B2D7CE; --green-soft:#CDEED7; --green-ink:#2E874D; --edit:#399A79;
  --off:#C3BCB3; --off-2:#DFDAD4; --white:#FFFFFF; --promo:#E87535; --scrim:rgba(30,28,26,.5); --outer:#E5E1DB; --danger:#C0392B;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--outer);color:var(--ink);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;
  box-sizing:border-box;overflow:hidden;-webkit-tap-highlight-color:transparent}
#viewport{position:relative;width:100%;height:100%}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center;background:var(--bg);overflow:hidden;
  box-shadow:0 10px 40px rgba(60,50,40,.18);font-variant-numeric:tabular-nums;color:var(--ink);line-height:1}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;line-height:1}
button:focus-visible{outline:4px solid var(--green);outline-offset:3px}
button:disabled{cursor:default}
img{display:block;max-width:none}
.screen{position:absolute;inset:0}
.abs{position:absolute}
.scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.c{left:0;right:0;text-align:center}

/* header 0–84 */
.hdr{position:absolute;left:0;right:0;top:0;height:84px;border-bottom:1px solid var(--line);background:var(--bg)}
.hdr .where{position:absolute;right:113px;top:29px;font-size:24px}
.hdr .home{position:absolute;left:997px;top:17px;width:48px;height:48px;display:grid;place-items:center;color:var(--ink-2)}
.hdr .home svg{width:38px;height:40px}

/* bottom bar 1700–1920 */
.bar{position:absolute;left:0;right:0;top:1700px;height:220px;border-top:2px solid var(--line);background:var(--bg)}
.btn{position:absolute;top:30px;height:156px;width:336px;border-radius:8px;font-size:36px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:14px}
.btn.l{left:33px}.btn.r{right:33px}.btn.mid{left:372px}
.btn.ghost{background:var(--tile);border:2px solid var(--tile-2);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--white)}
.btn.primary:disabled{background:#E4DFD8;color:#9A928A}
.btn.ghost.danger{background:#FFF4F1;border-color:#EDC3BB;color:var(--danger)}
.btn.ghost.danger:active{background:#FBE2DC}
.btn .amt{font-weight:700;margin-left:18px}
.btn:active:not(:disabled){filter:brightness(.94)}
.btn.ghost:active{background:var(--tile-2)}

/* menu */
.promo{position:absolute;left:0;right:0;top:84px;height:76px;background:var(--white)}
.promo .ic{position:absolute;left:30px;top:20px;width:36px;height:36px;border-radius:50%;background:var(--promo);color:var(--white);display:grid;place-items:center}
.promo .ic svg{width:22px;height:22px}
.promo .tx{position:absolute;left:81px;top:24px;font-size:28px;font-weight:500}
.promo .all{position:absolute;left:901px;top:13px;width:164px;height:50px;border:2px solid var(--tile-2);color:var(--ink-2);font-size:24px;border-radius:4px}
.cats{position:absolute;left:16px;top:176px;width:250px;display:flex;flex-direction:column;gap:8px}
.cat{position:relative;height:110px;border-radius:4px;background:var(--tile);color:var(--ink-2);font-size:36px;font-weight:500;overflow:hidden}
.cat.on{background:var(--dark);color:var(--white)}
.cat .n{position:absolute;right:12px;top:12px;min-width:32px;height:32px;padding:0 8px;border-radius:4px;background:var(--accent);color:var(--white);font-size:20px;font-weight:700;display:grid;place-items:center}
.grid{position:absolute;left:281px;top:176px;right:0;bottom:220px;padding:0 15px 16px 0;display:grid;grid-template-columns:repeat(3,256px);gap:8px;align-content:start}
.tile{position:relative;width:242px;height:276px;background:var(--tile);border-radius:8px;display:block;text-align:center;flex:none;transition:box-shadow .15s,background .15s}
.tile .ph{position:absolute;left:8px;right:8px;top:8px;height:160px;border-radius:4px;overflow:hidden;background:#2a2622}
.tile .ph img{width:100%;height:100%;object-fit:cover}
.tile .nm{position:absolute;left:4px;right:4px;top:186px;font-size:28px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .pr{position:absolute;left:0;right:0;top:228px;font-size:28px;color:var(--accent)}
.tile.on{background:var(--white);box-shadow:inset 0 0 0 4px var(--accent)}
.tile .badge{position:absolute;left:0;top:0;min-width:58px;height:58px;padding:0 14px;border-radius:8px 0 8px 0;background:var(--accent);color:var(--white);font-size:30px;font-weight:700;display:grid;place-items:center}
.tile .rm{position:absolute;right:14px;top:14px;width:52px;height:52px;border-radius:50%;background:var(--accent);border:4px solid var(--white);display:grid;place-items:center;color:var(--white)}
.tile .rm svg{width:28px;height:28px}
.cartbtn .l1{position:absolute;left:0;right:0;top:30px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:36px}
.cartbtn .l1 svg{width:38px;height:38px}
.cartbtn .l2{position:absolute;left:0;right:0;top:88px;font-size:36px;font-weight:700}
.cartbtn .cnt{position:absolute;left:-18px;top:-18px;min-width:60px;height:60px;padding:0 14px;background:var(--ink);color:var(--white);display:grid;place-items:center;font-size:28px;font-weight:700;border-radius:8px;border:4px solid var(--bg)}

/* product detail */
.pd-top{position:absolute;left:0;right:0;top:0;height:363px;background:var(--tile)}
.pd-top.combo{height:496px}
.pd-top .ph{position:absolute;left:32px;top:36px;width:405px;height:295px;border-radius:8px;overflow:hidden;background:#2a2622}
.pd-top .ph img{width:100%;height:100%;object-fit:cover}
.pd-top h2{position:absolute;left:475px;top:56px;margin:0;font-size:48px;font-weight:700;padding-right:110px}
.pd-top .price{position:absolute;left:475px;top:128px;font-size:36px;font-weight:500;color:var(--accent)}
.pd-top .desc{position:absolute;left:475px;top:192px;width:530px;margin:0;font-size:24px;line-height:36px;color:var(--ink-2)}
.x{position:absolute;left:979px;top:36px;width:64px;height:64px;display:grid;place-items:center;color:#000}
.x svg{width:48px;height:48px}
.tabs{position:absolute;left:32px;top:364px;display:flex;gap:13px}
.tabbtn{width:250px;height:108px;background:var(--white);color:var(--ink-2);border:2px solid var(--tile-2);border-radius:4px;font-size:36px;font-weight:500;position:relative}
.tabbtn.on{background:var(--accent);color:var(--white);border-color:var(--accent)}
.tabbtn .dot{position:absolute;right:10px;top:10px;font-size:20px;font-weight:400;color:var(--mute)}
.tabbtn .dot.ok{right:10px;top:10px;width:30px;height:30px;color:var(--accent);display:grid;place-items:center}
.tabbtn .dot.ok svg{width:26px;height:26px}
.tabbtn.on .dot{color:var(--white)}
.pd-body{position:absolute;left:0;right:0;top:363px;bottom:220px;padding:46px 38px 40px;display:flex;flex-direction:column;gap:62px}
.pd-body.combo{top:496px;padding:46px 25px 40px 24px;gap:0}
.sec-h{position:relative;height:49px;border-bottom:1px solid var(--line);padding-left:12px;font-size:28px;line-height:32px;font-weight:700;display:flex;align-items:flex-start;gap:20px;margin-bottom:16px}
.sec-h .req{display:inline-flex;align-items:center;gap:6px;height:30px;margin-top:3px;background:var(--peach);color:var(--accent);font-size:22px;font-weight:500;line-height:1;padding:0 12px 0 10px;border-radius:15px}
.sec-h .req.free{background:var(--tile);color:var(--mute);padding:0 12px}
.sec-h .req svg{width:20px;height:20px}
.sec-h .limit{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:24px;margin-top:2px}
.sec-h .limit b{width:40px;height:40px;border:2px solid var(--tile-2);border-radius:3px;display:grid;place-items:center;color:var(--accent);font-weight:500;font-size:24px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pd-body .chips{grid-template-columns:repeat(4,242px)!important;justify-content:start}
.chip{height:110px;background:var(--tile);border-radius:4px;font-size:36px;font-weight:500;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.chip small{font-size:22px;color:var(--accent);font-weight:400}
.chip.on{background:var(--white);color:var(--accent);box-shadow:inset 0 0 0 4px var(--accent)}
.otiles{display:grid;grid-template-columns:repeat(4,242px);gap:12px;justify-content:start}
.otile{display:flex;flex-direction:column;gap:11px;min-width:0}
.otile .tile,.otile .adj{width:100%}
.adj.ph{visibility:hidden}
.adj.two{padding-right:44px}
.adj{position:relative;height:56px;width:256px;border:2px solid var(--accent-soft);background:#FFF5EF;color:var(--accent);border-radius:8px;box-shadow:0 2px 0 rgba(201,79,21,.12);font-size:24px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 20px}
.adj svg{width:26px;height:26px;color:var(--accent);flex:none}
.adj:active{background:#FBE3D6;box-shadow:none;transform:translateY(1px)}
.adj:not(.ph)::after{content:"";position:absolute;right:18px;top:50%;width:10px;height:10px;border-right:3px solid var(--accent);border-top:3px solid var(--accent);transform:translateY(-50%) rotate(45deg)}
.adj:not(.two){padding-right:34px}
.adj.two{height:84px;justify-content:flex-start;padding:0 44px 0 20px;gap:14px;text-align:left}
.adj.two>span{min-width:0}
.adj.two small{display:block;font-size:20px;color:var(--ink-2);font-weight:400}
.adj.two b{display:block;font-size:24px;color:var(--accent);font-weight:500;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.sumtx{display:block;margin-top:-2px;font-size:22px;line-height:1.4;color:var(--accent);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .card .d .fl{color:var(--accent)}
.adj:disabled{border-color:transparent;background:var(--tile-2);color:var(--white)}
.adj .sum{font-size:18px;color:var(--ink-2);max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citems{display:grid;grid-template-columns:repeat(2,512px);gap:23px 8px;margin-top:-3px}
.citem .card{position:relative;height:176px;background:var(--tile);border-radius:8px}
.citem .card .ph{position:absolute;left:8px;top:8px;width:240px;height:160px;border-radius:4px;overflow:hidden;background:#2a2622}
.citem .card .ph img{width:100%;height:100%;object-fit:cover}
.citem .card b{position:absolute;left:264px;top:13px;font-size:28px;font-weight:500}
.citem .card .p{position:absolute;left:264px;top:68px;font-size:28px;color:var(--accent)}
.citem .card .d{position:absolute;left:264px;top:122px;font-size:24px}
.citem .row{position:relative;height:56px;margin-top:12px}
.citem .row .step{position:absolute;left:14px;top:0}
.citem .row .adj{position:absolute;right:0;top:0;width:220px;height:56px}
.step{display:flex;align-items:center}
.step button{width:56px;height:56px;border-radius:4px;display:grid;place-items:center;background:var(--accent);color:var(--white)}
.step button:disabled{background:var(--tile-2)}
.step button svg{width:26px;height:26px}
.step span{width:92px;text-align:center;font-size:28px}
.pd-bar .step{position:absolute;left:37px;top:80px}
.pd-bar .step span{width:110px;font-size:48px}
.pd-bar .btn.r{flex-direction:column;gap:6px}
.pd-bar .btn.r .amt{margin-left:0;font-size:32px}
.pd-bar .step button:disabled{background:var(--off)}
.pd-bar .total{position:absolute;left:446px;top:1778px;top:78px;font-size:52px}

/* sheets: full-height panels with 40px top corners */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;animation:fade .2s ease}
.sheet{position:absolute;left:0;right:0;top:0;bottom:0;z-index:21;background:var(--bg);border-radius:40px 40px 0 0;animation:up .3s cubic-bezier(.2,.8,.2,1)}
.sheet .sh-title{position:absolute;left:0;right:0;top:56px;text-align:center;font-size:36px;font-weight:700}
.sheet.pop{top:50%;bottom:auto;left:56px;right:56px;transform:translateY(-50%);border-radius:24px;display:flex;flex-direction:column;max-height:1700px;animation:popin .25s ease-out;box-shadow:0 24px 60px rgba(30,28,26,.25)}
.sheet.pop .sh-title{position:static;padding:52px 0 40px}
.sheet.pop .sh-body{position:static;padding:0 40px 40px}
.pop-acts{display:flex;justify-content:center;gap:24px;padding:8px 40px 48px}
.pop-acts .btn{position:static;width:300px;height:120px}
@keyframes popin{from{opacity:0;transform:translateY(-50%) scale(.96)}to{opacity:1;transform:translateY(-50%)}}
.sheet .sh-body{position:absolute;left:0;right:0;top:148px;bottom:220px;padding:0 38px 40px;display:flex;flex-direction:column;gap:62px}
.sheet .sh-body.up{top:134px;padding:0 148px 40px}
.up-grid{display:grid;grid-template-columns:repeat(3,256px);gap:23px 8px}
.up-cell{display:flex;flex-direction:column;align-items:center;gap:15px}
.up-cell .step button{width:54px}
.up-cell .step button:disabled{background:var(--off-2)}
.up-cell .step span{width:94px;font-size:28px}

/* cart */
.cart-title{position:absolute;left:0;right:0;top:124px;text-align:center;font-size:36px;font-weight:700}
.cart-x{position:absolute;right:36px;top:118px;height:52px;padding:0 20px;border:2px solid var(--danger);color:var(--danger);border-radius:26px;font-size:24px;display:flex;align-items:center;gap:8px}
.cart-x svg{width:24px;height:24px}
.lines{position:absolute;left:0;right:0;top:214px;bottom:320px}
.line{position:relative;min-height:70px;padding:11px 0;border-bottom:2px solid var(--row);display:flex;align-items:center}
.line .no{position:absolute;left:20px;font-size:24px;font-weight:700}
.line .nm{margin-left:74px;width:450px;min-width:0}
.line .nm b{display:block;font-size:28px;line-height:28px;font-weight:500}
.line .nm small{display:block;font-size:24px;line-height:32px;margin-top:2px;color:var(--mute)}
.line .nm b + small{margin-top:10px}
.edit{position:absolute;left:526px;display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:24px}
.edit svg{width:22px;height:22px}
.line .step{position:absolute;left:659px}
.line .step button{width:54px;height:54px;background:var(--white);border:2px solid var(--accent);color:var(--accent)}
.line .step button:disabled{border-color:var(--accent-soft);color:var(--accent-soft);background:var(--white)}
.line .step button svg{width:22px;height:22px}
.line .step span{width:82px;font-size:26px}
.line .lp{position:absolute;right:92px;width:120px;text-align:right;font-size:28px;font-weight:500}
.trash{position:absolute;left:1012px;width:48px;height:48px;display:grid;place-items:center;color:var(--ink)}
.trash svg{width:32px;height:34px}
.empty{padding-top:150px;text-align:center;color:var(--mute);font-size:32px}
.summary{border-top:2px solid var(--sum);margin-top:24px;padding:28px 92px 32px 74px;display:flex;flex-direction:column;gap:20px;font-size:28px}
.summary div{display:flex;justify-content:space-between;line-height:28px}
.summary .disc{color:var(--green-ink)}
.grand{position:absolute;left:0;right:0;top:1600px;height:100px;background:var(--peach);display:flex;align-items:center;justify-content:flex-end;padding:0 64px 0 0;gap:16px;color:var(--accent);font-size:48px;font-weight:700}
.grand small{font-size:28px;font-weight:500}
.cart-bar .btn.r svg{width:76px;height:76px;overflow:visible;margin-left:-8px}
.cbody{position:absolute;left:0;right:0;top:214px;bottom:320px;display:flex;flex-direction:column}
.cbody .lines{position:static;flex:1;min-height:0}
.cbody .summary{flex:none;margin-top:0}
.btn .pcoin{transform-box:fill-box;transform-origin:center;animation:pcoin 1.8s ease-in-out infinite}
.btn .phand{animation:phand 1.8s ease-in-out infinite}
.btn:disabled .pcoin,.btn:disabled .phand{animation:none}
@keyframes pcoin{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-4px) rotate(-12deg)}55%{transform:translateY(-4px) rotate(12deg)}75%{transform:translateY(1px) rotate(0)}}
@keyframes phand{0%,100%{transform:translateY(0)}75%{transform:translateY(-1.5px)}}

/* choice pages: payment, invoice, welcome */
.ttl{position:absolute;left:0;right:0;top:265px;text-align:center;font-size:48px;font-weight:700}
.due{position:absolute;left:0;right:0;top:357px;text-align:center;font-size:36px;font-weight:500;color:var(--accent)}
.opt{position:absolute;width:398px;height:318px;background:var(--tile);border:4px solid var(--tile-2);border-radius:16px;color:var(--ink)}
.opt .icw{position:absolute;left:0;right:0;top:44px;height:130px;display:flex;align-items:center;justify-content:center}
.opt .icw img{height:100px;width:auto;max-width:250px;object-fit:contain}
.opt.inv .icw img{height:116px}
.opt .lb{position:absolute;left:0;right:0;top:204px;text-align:center;font-size:36px}
.opt:active,.opt.pressed{background:var(--tile-2)}
.opt .icw svg{width:120px;height:120px;color:var(--dark)}
.note{position:absolute;left:0;right:0;top:1590px;text-align:center;font-size:28px;color:var(--mute)}

/* pay process */
.p-sub{position:absolute;left:0;right:0;top:266px;text-align:center;font-size:36px;color:var(--ink-2)}
.p-hl{position:absolute;left:0;right:0;top:330px;text-align:center;font-size:48px;font-weight:700;color:var(--accent)}
.p-amt{position:absolute;left:0;right:0;top:1170px;text-align:center;font-size:36px;font-weight:500;color:var(--ink)}
.p-time{position:absolute;left:0;right:0;top:1232px;text-align:center;font-size:28px;color:var(--mute)}
.sim{position:absolute;left:340px;right:340px;top:1300px;height:64px;font-size:24px;color:var(--mute);text-decoration:underline;text-underline-offset:6px}
.scene{position:absolute;left:251px;top:511px;width:518px;height:588px;cursor:pointer}
.scene .kc{position:absolute;inset:0;overflow:hidden}
.scene .kw{position:absolute;left:79.9px;top:11px;width:363.2px;height:564px;transform-origin:0 0}
.scene .kp{position:absolute;inset:0}
.scene .k{display:block;width:363.2px}
/* overlays live in the kiosk's own coordinates (source px × 0.2522) so they move with the camera */
.scene .card{position:absolute;left:127px;top:395px;width:76px;opacity:0}
.scene .ring{position:absolute;left:146px;top:414px;width:30px;height:30px;border:2px solid var(--accent);border-radius:50%;opacity:0}
.scene .ring.r2{animation-delay:2.25s!important}
.scene .phone{position:absolute;left:180px;top:430px;width:58px;opacity:0}
.scene .beam{position:absolute;left:141px;top:494px;width:42px;height:2.5px;border-radius:2px;background:#FF3B30;box-shadow:0 0 6px 1px #FF3B30;opacity:0}
.scene .coin{position:absolute;left:261.5px;top:42px;width:24px;opacity:0;transform-origin:center}
.scene .bslot{position:absolute;left:50px;top:457px;width:56px;height:110px;overflow:hidden}
.scene .bill{position:absolute;left:-15px;top:0;width:86px;opacity:0;transform:translateY(38px) rotate(90deg)}
/* camera moves */
.scene.tap .kw{animation:camtap .8s .35s cubic-bezier(.65,0,.35,1) forwards}
.scene.scan .kw{animation:camscan .8s .35s cubic-bezier(.65,0,.35,1) forwards}
.scene.cash .kw{animation:camcash .8s .35s cubic-bezier(.65,0,.35,1) forwards}
@keyframes camtap{to{transform:translate(-190.3px,-686px) scale(2.2531)}}
@keyframes camscan{to{transform:translate(-237.7px,-798.5px) scale(2.2531)}}
@keyframes camcash{to{transform:translate(-433.5px,125.3px) scale(2.2531)}}
/* card tap */

function newDraft(p){
  const d={pid:p.id,qty:1,sel:{},upg:null,combo:null};
  p.groups.forEach(g=>d.sel[g.id]=g.options[0].id);
  if(p.combo){d.combo={};p.combo.forEach(t=>d.combo[t.id]=[]);}
  return d;
}
function optPrice(g,id){const o=g.options.find(o=>o.id===id);return o?o.price:0;}
function unitPrice(l){
  const p=PBY[l.pid]; let v=p.price;
  p.groups.forEach(g=>v+=optPrice(g,l.sel[g.id]));
  if(l.upg){const u=UPGRADE.options.find(o=>o.id===l.upg.id);v+=u.price;u.parts.forEach(k=>v+=optPrice(PARTS[k],l.upg.parts[k]));}
  if(l.combo){p.combo.forEach(t=>l.combo[t.id].forEach(e=>{v+=t.items.find(i=>i.id===e.iid).price*e.qty;}));}
  return v;
}
function optName(g,id){const o=g.options.find(o=>o.id===id);return o?o.name:"";}
function lineDesc(l){
  const p=PBY[l.pid], out=[];
  if(p.groups.length) out.push(p.groups.map(g=>g.id==="rice"?"飯量"+optName(g,l.sel[g.id]):optName(g,l.sel[g.id])).join("、"));
  if(l.upg){const u=UPGRADE.options.find(o=>o.id===l.upg.id);out.push("套餐升級："+u.name+"（"+u.parts.map(k=>optName(PARTS[k],l.upg.parts[k])).join("、")+"）");}
  if(l.combo) p.combo.forEach(t=>l.combo[t.id].forEach(e=>{
    const it=t.items.find(i=>i.id===e.iid); let s="- "+it.name+(e.qty>1?" ×"+e.qty:"");
    const f=t.flavor.map(g=>optName(g,e.flavor[g.id])).filter(Boolean); if(f.length) s+="（"+f.join("、")+"）"; out.push(s);
  }));
  return out;
}
function totals(){
  let sub=0,count=0; const drinks=[];
  S.cart.forEach(l=>{const u=unitPrice(l);sub+=u*l.qty;count+=l.qty;if(PBY[l.pid].cat==="drink")for(let i=0;i<l.qty;i++)drinks.push(u);});
  drinks.sort((a,b)=>b-a); let disc=0; for(let i=1;i<drinks.length;i+=2)disc+=drinks[i];
  const fee=S.mode==="dine"?Math.round((sub-disc)*0.1):0;
  return {sub,disc,fee,total:sub-disc+fee,count};
}
function countOf(pid){return S.cart.filter(l=>l.pid===pid).reduce((a,l)=>a+l.qty,0);}
function catCount(cid){return S.cart.filter(l=>PBY[l.pid].cat===cid).reduce((a,l)=>a+l.qty,0);}

}
const INPUT={
  mobile:{title:"手機點餐付款",hint:"請輸入手機訂單上的 4 碼取餐碼（展示用，任意 4 碼即可）",ph:"4 碼取餐碼",max:4,test:v=>/^\d{4}$/.test(v),err:"取餐碼為 4 碼數字"},
  taxid:{title:"輸入統一編號",hint:"請輸入 8 碼統一編號",ph:"8 碼數字",max:8,test:v=>/^\d{8}$/.test(v),err:"統一編號須為 8 碼數字"},
  carrier:{title:"輸入手機條碼載具",hint:"格式為「/」加上 7 碼英數字，例如 /ABC1234",ph:"/XXXXXXX",max:8,alpha:true,test:v=>/^\/[0-9A-Z.+\-]{7}$/.test(v),err:"載具須為「/」開頭，共 8 碼"},
  donate:{title:"輸入愛心碼",hint:"請輸入 3–7 碼愛心碼，或選擇下方常用機構",ph:"愛心碼",max:7,test:v=>/^\d{3,7}$/.test(v),err:"愛心碼須為 3–7 碼數字",
    quick:[["919","創世基金會"],["8585","家扶基金會"],["25885","伊甸基金會"]]}
};

/* ---------- render ---------- */
let lastSheet=null,lastModal=null;
function render(){
  const keep={}; $stage.querySelectorAll("[data-scroll]").forEach(el=>keep[el.dataset.scroll]=el.scrollTop);
  const V={carrier:vCarrier,attract:vAttract,welcome:vWelcome,table:vTable,menu:vMenu,detail:vDetail,cart:vCart,invoice:vInvoice,payment:vPayment,process:vProcess,done:vDone}[S.screen];
  $stage.innerHTML=V()+vSheet()+vModal();
  const still=[]; if(S.sheet&&S.sheet===lastSheet) still.push(".sheet",".scrim"); if(S.modal&&S.modal===lastModal) still.push(".modal:not(.shake)",".scrim");
  if(still.length) $stage.querySelectorAll(still.join(",")).forEach(e=>e.style.animation="none");
  lastSheet=S.sheet; lastModal=S.modal;
  $stage.querySelectorAll("[data-scroll]").forEach(el=>{if(keep[el.dataset.scroll])el.scrollTop=keep[el.dataset.scroll];});
}
let toastT;
function toast(msg){const old=$stage.querySelector(".toast");if(old)old.remove();const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;$stage.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2200);}
function go(screen){S.screen=screen;stopTimer();if(screen==="process")startTimer();render();const s=$stage.querySelector("[data-scroll]");if(s&&screen!=="menu")s.scrollTop=0;}
function startTimer(){S.timeLeft=70;S.timer=setInterval(()=>{S.timeLeft--;if(S.timeLeft<=0){stopTimer();go("payment");toast("付款逾時，請重新選擇付款方式");return;}
  const el=$stage.querySelector(".p-time");if(el)el.textContent="剩餘時間 "+S.timeLeft+" 秒";},1000);}
function stopTimer(){if(S.timer){clearInterval(S.timer);S.timer=null;}}
function resetAll(){stopTimer();Object.assign(S,{screen:"attract",floor:1,cat:"don",cart:[],draft:null,editing:null,sheet:null,modal:null,upsellDone:false,invoice:null,pay:null,paid:0,order:null});render();}
function finish(method){
  const t=totals(),names={cash:"現金支付",card:"信用卡支付",linepay:"LINE PAY 支付",mobile:"行動支付",easycard:"悠遊卡支付",counter:"臨櫃付款"};
  S.order={no:String(100+Math.floor(Math.random()*900)),method,methodName:names[method],total:t.total,count:t.count,change:method==="cash"?S.paid-t.total:0,invoice:invLabel()};
  S.timeLeft=20; go("done");
  S.timer=setInterval(()=>{S.timeLeft--; const el=$stage.querySelector(".auto"); if(el) el.textContent=S.timeLeft+" 秒後自動回到首頁"; if(S.timeLeft<=0) resetAll();},1000);
}
function openDetail(p,line){
  S.draft=line?clone(line):newDraft(p); S.editing=line?line.uid:null; S.tab=0; go("detail");
}
function comboOK(d){const p=PBY[d.pid];for(let i=0;i<p.combo.length;i++){const t=p.combo[i];if(d.combo[t.id].reduce((a,e)=>a+e.qty,0)<t.max)return i;}return -1;}
function sameConfig(a,b){return a.pid===b.pid&&JSON.stringify([a.sel,a.upg,a.combo])===JSON.stringify([b.sel,b.upg,b.combo]);}
function addLine(d){const ex=S.cart.find(l=>sameConfig(l,d));if(ex)ex.qty+=d.qty;else S.cart.push(Object.assign(clone(d),{uid:S.uid++}));}

/* ---------- actions ---------- */
$stage.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b||b.disabled) return;
  const [a,x,y]=b.dataset.a.split(":"); const d=S.draft;
  switch(a){
    case "mode": if(x==="dine"){S.mode="dine";S.floor=1;go("table");} else {S.mode="take";go("menu");} break;
    case "floor": S.floor=+x; render(); break;
    case "tpick": S.table=S.floor+"樓 "+x+"號"; go("menu"); toast("已選擇桌號："+S.table); break;
    case "home": if(S.screen==="done"){resetAll();break;} if(S.cart.length&&S.screen!=="menu"){go("menu");} else if(S.cart.length){S.modal={kind:"cancel"};render();} else resetAll(); break;
    case "back-welcome": if(S.cart.length){S.modal={kind:"cancel"};render();} else go(S.mode==="dine"?"table":"welcome"); break;
    case "go-mode": case "start": go("welcome"); break;
    case "cscan": {const ch="ABCDEFGHJKLMNPQRSTUVWXYZ0123456789";let v="/";for(let i=0;i<7;i++)v+=ch[Math.floor(Math.random()*ch.length)];S.invoice={type:"carrier",value:v};go("payment");toast("已帶入載具 "+v);break;}
    case "ckey": S.modal={kind:"input",type:"carrier",value:"/"}; render(); break;
    case "mpay": S.modal={kind:"input",type:"mobile",value:""}; render(); break;
    case "lang": S.modal={kind:"lang"}; render(); break;
    case "langset": S.modal=null; render(); if(x!=="zh") toast("此展示版目前只提供繁體中文介面"); break;
    case "cat": S.cat=x; render(); {const g=$stage.querySelector(".grid");if(g)g.scrollTop=0;} break;
    case "promos": S.modal={kind:"promos"}; render(); break;
    case "open": openDetail(PBY[x]); break;
    case "close-detail": S.draft=null; go(S.editing!=null?"cart":"menu"); S.editing=null; break;
    case "sel": d.sel[x]=y; render(); break;
    case "upg": if(d.upg&&d.upg.id===x) d.upg=null; else {const u=UPGRADE.options.find(o=>o.id===x);d.upg={id:x,parts:Object.fromEntries(u.parts.map(k=>[k,PARTS[k].options[0].id]))};} render(); break;
    case "upgflav": {const u=UPGRADE.options.find(o=>o.id===d.upg.id);
      S.sheet={kind:"flavor",title:u.name+" (單份)",target:"upg",val:Object.assign({},d.upg.parts),groups:u.parts.map(k=>Object.assign({key:k},PARTS[k])),top:620}; render(); break;}
    case "tab": S.tab=+x; render(); {const s=$stage.querySelector(".pd-body");if(s)s.scrollTop=0;} break;
    case "cinc": case "cdec": {const t=PBY[d.pid].combo[S.tab],arr=d.combo[t.id],n=arr.reduce((s,e)=>s+e.qty,0);let e2=arr.find(e=>e.iid===x);
      if(a==="cinc"){if(n>=t.max){toast(t.name+"最多選 "+t.max+" 項");break;} if(e2)e2.qty++; else arr.push({iid:x,qty:1,flavor:Object.fromEntries(t.flavor.map(g=>[g.id,g.options[0].id]))});
        if(n+1>=t.max&&S.tab<PBY[d.pid].combo.length-1&&comboOK(d)!==-1){const nx=comboOK(d);if(nx>S.tab){S.tab=nx;}}}
      else if(e2){e2.qty--; if(!e2.qty) arr.splice(arr.indexOf(e2),1);} render(); break;}
    case "cflav": {const t=PBY[d.pid].combo[S.tab],e2=d.combo[t.id].find(e=>e.iid===x),it=t.items.find(i=>i.id===x);
      S.sheet={kind:"flavor",title:it.name+" 調整口味",target:"combo",tab:t.id,iid:x,val:Object.assign({},e2.flavor),groups:t.flavor.map(g=>Object.assign({key:g.id,tiles:false},g)),top:t.flavor.length>1?820:1120}; render(); break;}
    case "fsel": S.sheet.val[x]=y; render(); break;
    case "flavor-ok": {const sh=S.sheet; if(sh.target==="upg") d.upg.parts=sh.val; else d.combo[sh.tab].find(e=>e.iid===sh.iid).flavor=sh.val; S.sheet=null; render(); break;}
    case "sheet-x": if(S.sheet&&S.sheet.kind==="upsell"){S.sheet=null;render();} else {S.sheet=null;render();} break;
    case "qinc": d.qty++; render(); break;
    case "qdec": if(d.qty>1) d.qty--; render(); break;
    case "confirm-detail": {
      const p=PBY[d.pid];
      if(p.combo){const i=comboOK(d); if(i!==-1){S.tab=i;toast("請完成「"+p.combo[i].name+"」的選擇");break;}}
      if(S.editing!=null){const idx=S.cart.findIndex(l=>l.uid===S.editing);S.cart[idx]=Object.assign(clone(d),{uid:S.editing});S.editing=null;S.draft=null;go("cart");toast("已更新餐點");}
      else {addLine(d);S.draft=null;go("menu");toast("已加入購物車："+p.name+" ×"+d.qty);}
      break;}
    case "cart": go("cart"); break;
    case "menu": go("menu"); break;
    case "edit": openDetail(PBY[S.cart.find(l=>l.uid===+x).pid],S.cart.find(l=>l.uid===+x)); break;
    case "linc": S.cart.find(l=>l.uid===+x).qty++; render(); break;
    case "ldec": {const l=S.cart.find(l=>l.uid===+x); if(l.qty>1)l.qty--; render(); break;}
    case "del": S.cart=S.cart.filter(l=>l.uid!==+x); render(); break;
    case "ask-cancel": S.modal={kind:"cancel"}; render(); break;
    case "modal-x": S.modal=null; render(); break;
    case "reset": resetAll(); break;
    case "checkout": if(!S.upsellDone){S.sheet={kind:"upsell",q:{}};render();} else go("invoice"); break;
    case "uinc": S.sheet.q[x]=(S.sheet.q[x]||0)+1; render(); break;
    case "udec": if(S.sheet.q[x]) S.sheet.q[x]--; render(); break;
    case "upsell-skip": S.sheet=null; S.upsellDone=true; go("invoice"); break;
    case "upsell-add": {let n=0;Object.entries(S.sheet.q).forEach(([id,q])=>{if(q>0){const dd=newDraft(PBY[id]);dd.qty=q;addLine(dd);n+=q;}});
      S.sheet=null; S.upsellDone=true; go("invoice"); toast("已加點 "+n+" 份"); break;}
    case "invoice": go("invoice"); break;
    case "inv": if(x==="paper"){S.invoice={type:"paper"};go("payment");} else if(x==="carrier"){go("carrier");} else {S.modal={kind:"input",type:x,value:x==="carrier"?"/":""};render();} break;
    case "ik": {const m=S.modal,cfg=INPUT[m.type]; if(m.value.length<cfg.max){ if(m.type==="carrier"&&x==="/"&&m.value.length) break; m.value+=x;} m.err=""; render(); break;}
    case "ibs": S.modal.value=S.modal.value.slice(0,-1); S.modal.err=""; render(); break;
    case "iclr": S.modal.value=S.modal.type==="carrier"?"/":""; S.modal.err=""; render(); break;
    case "iq": S.modal.value=x; S.modal.err=""; render(); break;
    case "iok": {const m=S.modal,cfg=INPUT[m.type]; if(!cfg.test(m.value)){m.err=cfg.err;m.shake=true;render();m.shake=false;break;}
      if(m.type==="mobile"){S.cart=[];const a=newDraft(PBY.oyako);a.upg={id:"ss",parts:{side:"cab",soup:"miso"}};addLine(a);const b=newDraft(PBY.mt);b.qty=2;addLine(b);addLine(newDraft(PBY.egg));
        S.mode="take";S.upsellDone=true;S.modal=null;go("cart");toast("已載入手機訂單，取餐碼 "+m.value);break;}
      S.invoice={type:m.type,value:m.value}; S.modal=null; go("payment"); break;}
    case "payment": go("payment"); break;
    case "pay": S.pay=x; S.paid=0; if(x==="counter") finish("counter"); else go("process"); break;
    case "paid": stopTimer(); finish(S.pay); break;
    case "bill": {S.paid+=+x; const t=totals(); if(S.paid>=t.total){stopTimer();finish("cash");} else {$stage.querySelector("#paid").textContent=money(S.paid);$stage.querySelector("#need").textContent=money(t.total-S.paid);} break;}
  }
});

/* ---------- scale to fit ---------- */
const vp=document.getElementById("viewport");
function fit(){const s=Math.min(vp.clientWidth/1080,vp.clientHeight/1920);$stage.style.transform=`translate(-50%,-50%) scale(${s})`;}
new ResizeObserver(fit).observe(vp); fit();
render();
/* portfolio deep links: the parent page posts {demoGo:key} to jump straight to a design highlight */
(function(){
  function tip(title,text){var o=$stage.querySelector(".demo-tip");if(o)o.remove();var d=document.createElement("div");d.className="demo-tip";d.innerHTML="<b>"+title+"</b>"+text;$stage.appendChild(d);setTimeout(function(){d.classList.add("out")},6500);setTimeout(function(){d.remove()},7100);}
  function base(){resetAll();S.mode="take";}
  var P={
    "pay-cash":function(){base();addLine(newDraft(PBY.oyako));S.upsellDone=true;S.invoice={type:"paper"};S.pay="cash";S.paid=0;go("process");tip("付款設備位置引導","畫面上的機台圖，直接對照實體機台的投幣口與紙鈔口");},
    "combo":function(){base();openDetail(PBY.oyako);tip("套餐一鍵升級","在同一個商品頁直接升級套餐，不用刪掉重點");},
    "addon":function(){base();addLine(newDraft(PBY.oyako));go("cart");S.sheet={kind:"upsell",q:{}};render();tip("加點商品","結帳前提供加購，也能一鍵略過");}
  };
  addEventListener("message",function(e){var k=e.data&&e.data.demoGo;if(P[k]){try{P[k]();}catch(err){console.error(err);}}});
  window.__demoReady=true;
})();

})();
</script>
<style>
.demo-tip{position:absolute;left:50%;bottom:210px;transform:translateX(-50%);z-index:60;max-width:880px;width:max-content;background:#2b2724;color:#fff;font-size:30px;line-height:1.5;padding:26px 40px;border-radius:28px;box-shadow:0 20px 50px rgba(0,0,0,.28);animation:demoTipIn .35s ease both;text-align:center}
.demo-tip b{display:block;color:#ffb38a;font-size:26px;letter-spacing:.04em;margin-bottom:6px}
.demo-tip.out{opacity:0;transition:opacity .5s}
@keyframes demoTipIn{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</body>
