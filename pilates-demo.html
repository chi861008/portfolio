<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pilates scheduling — interactive demo</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#252932;background:#f5f1eb}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #1e75ff;outline-offset:2px}.app{max-width:520px;min-height:100vh;margin:auto;background:#f7f3ed;box-shadow:0 0 38px #5b51411a}.top{background:#3283f4;color:#fff;padding:19px 22px 22px}.top small{opacity:.86}.top h1{font-size:21px;margin:8px 0 0}.demo-note{background:#e6edf9;color:#315b94;padding:10px 20px;font-size:12px;line-height:1.5}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:15px}.tabs button{border:1px solid #d8d3cc;background:#fff;color:#777;padding:11px 3px;border-radius:12px;font-size:12px}.tabs button.active{background:#2e80f4;color:white;border-color:#2e80f4}.main{padding:5px 20px 108px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;color:#7b746b}.card{background:#fff;border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 3px 13px #413b3110}.card h2{font-size:19px;margin:4px 0 8px}.sub{color:#79746f;font-size:13px;line-height:1.65;margin:4px 0 15px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;color:#89827c;font-size:12px;padding:6px 0}.day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:11px;background:#f2f0eb;font-size:13px;color:#78716b;padding:0;position:relative}.day.available{background:#dceafe;color:#1568d3}.day.selected{background:#3083fa;color:white;border-color:#3083fa;font-weight:750}.day.scheduled{background:#d3e6ff;border:2px dashed #2e80f4;color:#1568d3;font-weight:750}.day:disabled{cursor:default}.legend{display:flex;gap:15px;align-items:center;margin:14px 2px;font-size:11px;color:#68635e}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:#dceafe}.dot.blue{background:#3083fa}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:#f1f5fe;border-radius:13px;padding:14px 4px;text-align:center}.metric strong{display:block;font-size:23px;color:#2678e8}.metric span{font-size:10px;color:#737b89}.list{display:grid;gap:8px}.list-row{border:1px solid #eee5da;border-radius:12px;padding:11px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px}.pill{padding:5px 9px;border-radius:20px;background:#e1eefe;color:#246fd3;font-size:11px;white-space:nowrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button,.bottom button{border:0;border-radius:12px;background:#3083f4;color:white;font-weight:700;padding:12px 15px}.actions button.secondary{color:#216ad0;background:#e8f0fe}.bottom{position:sticky;bottom:0;margin-top:-82px;background:linear-gradient(transparent,#f7f3ed 24%);padding:26px 20px 19px}.bottom button{width:100%;padding:16px;border-radius:14px;box-shadow:0 4px 12px #3778d233}.bottom button:disabled{background:#afc7e6;cursor:default;box-shadow:none}.alert{background:#fff4df;color:#815a25;border-radius:12px;padding:13px;font-size:12px;line-height:1.6}.week{display:grid;grid-template-columns:50px repeat(5,minmax(0,1fr));gap:4px}.week div{text-align:center;font-size:10px;color:#827c74;padding:6px 1px}.week .slot{min-height:43px;border-radius:7px;background:#f2f1ee}.week .busy{background:#dceafe;border:1px dashed #2e80f4;color:#1668d3;font-weight:700;display:grid;place-items:center}.feedback{font-size:12px;color:#276fb6;background:#eaf3ff;border-radius:10px;padding:10px 12px;margin-top:14px}footer{padding:12px 20px 26px;color:#999;font-size:11px;text-align:center} 
</style></head><body><div class="app"><header class="top"><small id="greeting">DEMO / 互動展示</small><h1 id="title">皮拉提斯排課系統</h1></header><div class="demo-note" id="notice">展示用模擬資料，操作不會影響真實課表。</div><nav class="tabs" id="tabs"></nav><main class="main" id="main"></main><div class="bottom"><button id="primary"></button></div><footer id="footer">Portfolio interactive prototype · No login required</footer></div><script>
const en=new URLSearchParams(location.search).get('lang')==='en';const t=(zh,eng)=>en?eng:zh;
const state={step:0,days:new Set([2,4,9,11,16,18,23,25]),generated:false,added:false,view:'student',feedback:''};
const students=[t('測試學生 48','Student 48'),t('Amy','Amy'),t('測試學生 58','Student 58')];
const tabs=[t('1 學生填時段','1 Student input'),t('2 自動排課','2 Auto schedule'),t('3 老師調整','3 Teacher review')];
const $=id=>document.getElementById(id);const renderTabs=()=>{$('tabs').innerHTML=tabs.map((label,i)=>`<button class="${i===state.step?'active':''}" data-step="${i}">${label}</button>`).join('');};
function cal(mode){const weekdays=[t('日','Sun'),t('一','Mon'),t('二','Tue'),t('三','Wed'),t('四','Thu'),t('五','Fri'),t('六','Sat')];let cells=weekdays.map(d=>`<div class="weekday">${d}</div>`).join('');for(let i=1;i<=30;i++){const chosen=state.days.has(i),scheduled=[4,11,18].includes(i)||(state.added&&i===25);const cls=mode==='input'?(chosen?'selected':''):(scheduled?'scheduled':chosen?'available':'');cells+=`<button class="day ${cls}" data-day="${i}" ${mode==='input'?'':'disabled'} aria-pressed="${chosen}">${i}</button>`;}return `<div class="calendar">${cells}</div>`;}
const card=(heading,body)=>`<section class="card"><h2>${heading}</h2>${body}</section>`;
function first(){return `<span class="eyebrow">STUDENT / INPUT</span>`+card(t('選擇可接受的上課日期','Select acceptable dates'),`<p class="sub">${t('請選擇你這個月有空的日期，可複選。老師將參考你的限制安排課程。','Select all dates that work for you. The instructor will consider your availability when scheduling.')}</p>`+cal('input')+`<div class="legend"><span><i class="dot blue"></i>${t('已選擇','Selected')}</span><span>${state.days.size} ${t('個日期','dates')}</span></div>`)+`<div class="feedback">${t('提示：點選日期可新增或移除，資料只存於這個展示頁面。','Tip: Select or deselect dates. Changes stay in this demo.')}</div>`;}
function second(){return `<span class="eyebrow">TEACHER / SCHEDULING</span>`+card(t('已填待安排與分享','Availability and scheduling'),`<div class="summary"><div class="metric"><strong>29</strong><span>${t('未填寫','Not submitted')}</span></div><div class="metric"><strong>31</strong><span>${t('已填','Submitted')}</span></div><div class="metric"><strong>${state.generated?3:0}</strong><span>${t('示範已排','Demo scheduled')}</span></div></div><p class="sub" style="margin-top:15px">${t('模擬 60 位學生的排課資料；以下只展示 3 位學生的操作範例。','Simulated scheduling data for 60 students. The demo shows three example students.')}</p>`)+card(t('待安排學生','Students to schedule'),`<div class="list">${students.map((s,i)=>`<div class="list-row"><span>${s}</span><span class="pill">${state.generated?(i===0?3:4):0} ${t('堂已排','scheduled')}</span></div>`).join('')}</div>`)+(state.generated?`<div class="feedback">${t('已產生示範草案。請前往「老師調整」檢視每位學生課表。','Demo draft generated. Continue to Teacher review to inspect schedules.')}</div>`:`<p class="sub">${t('點選下方「產生排課草案」查看系統配置的示範結果。','Generate a sample draft to preview the allocation.')}</p>`);}
function week(){let out=`<div class="week"><div></div>${['Mon','Tue','Wed','Thu','Fri'].map(x=>`<div>${x}</div>`).join('')}`;for(const h of ['13:00','14:00','15:00','16:00','17:00']){out+=`<div>${h}</div>`;for(let j=0;j<5;j++){const busy=state.generated&&((j+parseInt(h))%3===0||state.added&&h==='17:00'&&j===2);out+=`<div class="slot ${busy?'busy':''}">${busy?t('已排','Booked'):''}</div>`;}}return out+'</div>';}
function third(){return `<span class="eyebrow">TEACHER / REVIEW</span>`+card(t('老師審核排課草案','Review the scheduling draft'),`<div class="actions"><button class="${state.view==='student'?'':'secondary'}" data-view="student">${t('學生視角','Student view')}</button><button class="${state.view==='teacher'?'':'secondary'}" data-view="teacher">${t('老師週曆','Teacher week')}</button></div><p class="sub" style="margin-top:16px">${state.view==='student'?t('測試學生 48 — 可上課時段與已安排課程','Student 48 — availability and scheduled lessons'):t('同一份排課資料，以老師整週視角查看時段分布','The same schedule shown as the teacher’s weekly timetable')}</p>${state.view==='student'?cal('review'):week()}<div class="legend"><span><i class="dot blue"></i>${t('已排／可選時段','Scheduled / available')}</span></div>`)+(state.generated?card(t('人工調整與補位','Manual adjustments'),`<p class="sub">${t('11/25（三）17:00 尚有可安排空位。可由老師決定是否補入學生。','Nov 25 (Wed) 17:00 is available. The teacher may choose to assign a student.')}</p><div class="actions"><button class="secondary" id="adjust" ${state.added?'disabled':''}>${state.added?t('已補入課程','Lesson assigned'):t('將 Amy 排入空位','Assign Amy to slot')}</button></div>`):`<div class="alert">${t('請先到「自動排課」產生展示草案。','Generate a sample draft in Auto schedule first.')}</div>`)+(state.feedback?`<div class="feedback">${state.feedback}</div>`:'');}
function render(){renderTabs();$('main').innerHTML=[first,second,third][state.step]();$('primary').textContent=state.step===0?t('確認時段，下一步','Confirm dates & continue'):state.step===1?(state.generated?t('檢視排課草案','Review schedule'):t('產生排課草案','Generate sample draft')):t('重新體驗','Restart demo');}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-step]');if(!b)return;state.step=+b.dataset.step;render();});$('main').addEventListener('click',e=>{const day=e.target.closest('[data-day]');if(day&&state.step===0){const d=+day.dataset.day;state.days.has(d)?state.days.delete(d):state.days.add(d);render();}const view=e.target.closest('[data-view]');if(view){state.view=view.dataset.view;render();}if(e.target.closest('#adjust')){state.added=true;state.feedback=t('已將 Amy 加入示範課表；這項異動只存在展示頁面。','Amy was added to the sample schedule. No real data was changed.');render();}});$('primary').addEventListener('click',()=>{if(state.step===0)state.step=1;else if(state.step===1){if(!state.generated)state.generated=true;else state.step=2;}else{state.step=0;state.generated=false;state.added=false;state.feedback='';}render();});if(en){$('greeting').textContent='DEMO / INTERACTIVE PREVIEW';$('title').textContent='Pilates Scheduling';$('notice').textContent='Sample data only. No real lessons or accounts are affected.';}render();
</script></body></html>
